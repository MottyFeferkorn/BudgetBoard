{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <section class="auth-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="text-center mb-4">
                        <h1 class="fw-bold mb-2">Welcome back</h1>
                        <p class="text-secondary mb-0">
                            Log in to continue managing your money.
                        </p>
                    </div>

                    <div class="card auth-card">
                        <div class="card-body p-4 p-md-5">
                            {% if login_error %}
                                <div class="alert alert-danger" role="alert">
                                    {{ login_error }}
                                </div>
                            {% endif %}

                            <form action="/login" method="post">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-medium">
                                        Email address
                                    </label>
                                    <input
                                        class="form-control form-control-lg"
                                        id="email"
                                        name="username"
                                        type="email"
                                        placeholder="you@example.com"
                                        autocomplete="email"
                                        value="{{ username | default('') }}"
                                        required
                                        autofocus
                                    >
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label fw-medium">
                                        Password
                                    </label>
                                    <input
                                        class="form-control form-control-lg"
                                        id="password"
                                        name="password"
                                        type="password"
                                        placeholder="Enter your password"
                                        autocomplete="current-password"
                                        required
                                    >
                                </div>

                                <button class="btn btn-primary btn-lg w-100 auth-submit" type="submit">
                                    Log in
                                </button>
                            </form>

                            <p class="text-center text-secondary mt-4 mb-0">
                                Don't have an account?
                                <a class="auth-link fw-semibold ms-1" href="/register">Create one</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
